name: 🐛 Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 发生了什么？期望是什么、实际是什么？
      placeholder: "agent 在 TB 任务 X 上 agent_timeout，期望 resolved"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小复现路径（命令、任务名、环境）
      placeholder: |
        ./tb_run.sh run --agent-import-path coding_agent.tb_adapter:CodingAgentTB \
          --dataset-path tb/tasks --task-id sqlite-db-truncate
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: trace / events / 日志片段 / pane 输出（定位问题的关键）
      placeholder: "粘贴 events 中卡住的那条，或 tmux pane 铁证"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 初步定位层
      options:
        - "LLM Provider（调用/重试/failover）"
        - "Agent Loop（决策/停止条件）"
        - "工具执行（Backend/命令注入）"
        - "评测链路（TB harness/adapter）"
        - "还不确定"
    validations:
      required: true
