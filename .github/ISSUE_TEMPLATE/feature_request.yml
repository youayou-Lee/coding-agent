name: ✨ 功能提议
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 从用户/使用场景出发，而不是从实现出发
      placeholder: "工具失败时 Agent 只能把错误原文塞回观察，同一类瞬时错误反复撞墙"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 大致怎么做，涉及哪些模块
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 什么算做完？可测试的标准
      placeholder: "错误分类单测 ≥N 项；TB 基线对照数据贴在 PR 里"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 建议版本
      options:
        - "v0.5"
        - "v0.6"
        - "Backlog（暂不排期）"
    validations:
      required: true
